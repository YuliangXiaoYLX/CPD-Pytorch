name: Feature request
description: Suggest a new capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you have in mind, and references (papers, other libraries) if relevant.
